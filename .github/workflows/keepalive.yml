name: Keep Render API warm
# Push/manual runs configure the webhook; scheduled runs only health-check Render.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-webhook:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Configure Telegram webhook
        run: |
          curl --fail --silent --show-error --max-time 25 --request POST https://cf-downloader-bot.hadi-moradi10-hm.workers.dev/setup-webhook

  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 25 https://cf-downloader-api.onrender.com/health)"
          cat /tmp/health.json
          echo
          test "$code" = "200"
